name: Main Tests

on: 
  push:
    branches:
      - main

  pull_request:
    branches: 
      - main

env:
  JWT_ACCESS_EXPIRATION: "3600s"
  JWT_ACCESS_SECRET: "secret"
  JWT_REFRESH_SECRET: "segredo2"
  JWT_REFRESH_EXPIRATION: "7d"

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./backend

      - name: Run unit tests
        run: npm run test:unit
        working-directory: ./backend

  backend-coverage:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: TCC
          MYSQL_ROOT_PASSWORD: root123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./backend

      - name: Prepare integration test database
        run: npm run test:db:setup
        working-directory: ./backend

      - name: Enforce minimum test coverage
        run: npm run test:coverage
        working-directory: ./backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Run frontend checks
        run: npm test
        working-directory: ./frontend

      - name: Build frontend
        run: npm run build
        working-directory: ./frontend
        env:
          BACKEND_URL: http://127.0.0.1:3001
